name: Update AM feedstock public data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate feedstock database
        run: |
          python scripts/validate_feedstocks.py
          python scripts/export_material_passports.py
          python scripts/scan_datasheet_gaps.py

      - name: Fetch public source candidates
        run: |
          python -m am_powder_intel.ingest_public_sources --sources data/seed/public_sources.yml --out data/processed/latest_price_candidates.csv

      - name: Run tests
        run: |
          pytest -q

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/latest_price_candidates.csv data/processed/passport_completeness.csv data/processed/datasheet_gaps.csv
          git diff --cached --quiet || git commit -m "Update public AM feedstock candidates"
          git push
